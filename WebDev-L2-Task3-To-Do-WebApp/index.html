<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <!-- Add Task -->
        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addBtn">
                Add Task
            </button>
        </div>

        <!-- Pending Section -->
        <div class="task-section">

            <div class="heading">
                <h2>Pending Tasks</h2>
                <span id="pendingCount">0 Pending</span>
            </div>

            <div id="pendingList">

                <p class="empty">
                    No pending tasks.
                </p>

            </div>

        </div>

        <!-- Completed Section -->
        <div class="task-section">

            <div class="heading">
                <h2>Completed Tasks</h2>
                <span id="completedCount">0 Completed</span>
            </div>

            <div id="completedList">

                <p class="empty">
                    No completed tasks.
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
